<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盖亚计划 种族竞拍器 负分归一化版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .faction-card { transition: all 0.2s ease; }
        .faction-card:hover { transform: translateY(-1px); }
        .faction-btn {
            transition: all 0.15s ease;
            outline: none !important;
            border: 2px solid transparent !important;
        }
        .faction-btn.selected {
            border-color: #10b981 !important;
            background-color: #d1fae5 !important;
        }
        .faction-btn.disabled {
            border-color: #ef4444 !important;
            background-color: #fee2e2 !important;
            opacity: 0.7;
        }
        .faction-btn.paired-banned {
            opacity: 0.4;
        }
        .step-active { background-color: #3b82f6; color: white; }
        .log-entry { border-left: 3px solid #e5e7eb; padding-left: 10px; margin-bottom: 6px; font-size: 14px; }
        .log-switch { border-left-color: #f59e0b; }
        .log-bid { border-left-color: #3b82f6; }
        .log-win { border-left-color: #10b981; font-weight: bold; }
        .log-adjust { border-left-color: #8b5cf6; }
        .player-order-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background-color: #3b82f6;
            color: white;
            font-weight: bold;
            font-size: 11px;
            margin-right: 6px;
        }
        .faction-order-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border-radius: 3px;
            background-color: #10b981;
            color: white;
            font-weight: bold;
            font-size: 10px;
            margin-right: 5px;
        }
        .bid-cell { transition: all 0.3s ease; }
        .bid-cell.highlight { background-color: #dbeafe; font-weight: bold; }
        .winner-cell { background-color: #d1fae5; font-weight: bold; }
        .leader-cell {
            background-color: #d1fae5 !important;
            font-weight: bold;
            border: 2px solid #10b981 !important;
        }
        .original-bid { font-size: 14px; }
        .gap-value { font-size: 11px; color: #6b7280; }
        .current-bid {
            font-size: 16px;
            font-weight: bold;
            color: #3b82f6;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-5xl mx-auto px-4 py-6">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-1">盖亚计划 种族竞拍器</h1>
        <p class="text-center text-gray-500 mb-6 text-sm">支持负分输入 · 自动归一化最低出分置0 · 界面全程显示归一化后分数</p>

        <div id="player-order-display" class="bg-white rounded-lg shadow p-3 mb-5 hidden">
            <h3 class="text-base font-bold mb-2 text-gray-700">当前玩家顺位</h3>
            <div id="player-order-list" class="flex flex-wrap gap-3"></div>
        </div>

        <div class="flex justify-center mb-8">
            <div class="flex items-center space-x-3">
                <div id="step0-indicator" class="step-active w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm">1</div>
                <div class="w-12 h-1 bg-gray-200"></div>
                <div id="step1-indicator" class="w-8 h-8 rounded-full flex items-center justify-center font-bold bg-gray-200 text-gray-600 text-sm">2</div>
                <div class="w-12 h-1 bg-gray-200"></div>
                <div id="step2-indicator" class="w-8 h-8 rounded-full flex items-center justify-center font-bold bg-gray-200 text-gray-600 text-sm">3</div>
                <div class="w-12 h-1 bg-gray-200"></div>
                <div id="step3-indicator" class="w-8 h-8 rounded-full flex items-center justify-center font-bold bg-gray-200 text-gray-600 text-sm">4</div>
            </div>
        </div>

        <div id="step0" class="bg-white rounded-lg shadow-lg p-5 mb-6">
            <h2 class="text-xl font-bold mb-4 text-gray-800">步骤1：设置玩家信息</h2>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">玩家数量</label>
                <select id="player-count" class="border rounded-lg px-3 py-1.5 w-20 text-sm">
                    <option value="2">2人</option>
                    <option value="3" selected>3人</option>
                    <option value="4">4人</option>
                </select>
            </div>
            <div id="player-names-container" class="space-y-2 mb-5"></div>
            <div class="text-center">
                <button id="next-to-factions" class="bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-lg text-base font-bold">
                    下一步：选择种族 →
                </button>
            </div>
        </div>

        <div id="step1" class="bg-white rounded-lg shadow-lg p-5 mb-6 hidden">
            <h2 class="text-xl font-bold mb-4 text-gray-800">步骤2：选择可用种族</h2>
            <div class="mb-4 flex flex-wrap gap-3 items-center">
                <div>
                    <label class="inline-flex items-center">
                        <input type="checkbox" id="include-expansion" class="rounded">
                        <span class="ml-2 text-sm">包含舰队扩展</span>
                    </label>
                </div>
                <div class="text-xs text-gray-500">💡 点击切换：未选中→选中(绿)→禁用(红)</div>
                <div class="ml-auto flex gap-2">
                    <button id="random-all" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1.5 rounded-lg text-sm">随机补充</button>
                    <button id="reset-factions" class="bg-gray-500 hover:bg-gray-600 text-white px-3 py-1.5 rounded-lg text-sm">重置</button>
                </div>
            </div>
            <div id="factions-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 mb-5"></div>
            <div class="flex justify-between">
                <button id="back-to-names" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg text-sm">← 返回设置玩家</button>
                <button id="next-to-bid" class="bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-lg text-base font-bold disabled:opacity-50 disabled:cursor-not-allowed" disabled>下一步：输入出价 →</button>
            </div>
        </div>

        <div id="step2" class="bg-white rounded-lg shadow-lg p-5 mb-6 hidden">
            <h2 class="text-xl font-bold mb-4 text-gray-800">步骤3：输入每个玩家的最高出价</h2>
            <p class="text-gray-600 mb-4 text-sm">可输入负分，系统自动归一化把最低分拉到0，表格直接显示归一化后数值。</p>
            <div id="randomized-factions-display" class="bg-green-50 border border-green-200 rounded-lg p-3 mb-4">
                <h4 class="font-bold text-green-800 mb-2 text-sm">🎲 随机种族顺序</h4>
                <div id="randomized-factions-list" class="flex flex-wrap gap-2"></div>
            </div>
            <div id="bid-table-container" class="overflow-x-auto mb-5"></div>
            <div class="flex justify-between">
                <button id="back-to-factions" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg text-sm">← 返回选择种族</button>
                <button id="start-auction" class="bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-lg text-base font-bold">开始自动竞拍</button>
            </div>
        </div>

        <div id="step3" class="bg-white rounded-lg shadow-lg p-5 mb-6 hidden">
            <h2 class="text-xl font-bold mb-4 text-gray-800">步骤4：竞拍过程</h2>
            <div id="auction-factions-display" class="bg-blue-50 border border-blue-200 rounded-lg p-3 mb-4">
                <h4 class="font-bold text-blue-800 mb-2 text-sm">🎲 本次竞拍种族顺序</h4>
                <div id="auction-factions-list" class="flex flex-wrap gap-2"></div>
            </div>
            <div id="auction-status-container" class="mb-4 overflow-x-auto">
                <table id="auction-status-table" class="w-full border-collapse text-sm"></table>
            </div>
            <div class="text-xs text-gray-500 mb-4 text-center">
                单元格为归一化后分数 | 蓝色数字=当前出价 | 绿色边框=当前领先者
            </div>
            <div class="flex justify-center gap-3 mb-4">
                <button id="prev-step" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg text-sm disabled:opacity-50" disabled>← 上一步</button>
                <button id="auto-play" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg text-sm">▶ 自动播放</button>
                <button id="next-step" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg text-sm">下一步 →</button>
                <button id="skip-animation" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm">跳过动画</button>
            </div>
            <div class="mb-4">
                <h3 class="text-lg font-bold mb-2">拍卖日志</h3>
                <div id="auction-log" class="bg-gray-50 rounded-lg p-3 max-h-60 overflow-y-auto"></div>
            </div>
            <div id="final-results" class="hidden">
                <div id="results-summary" class="bg-green-50 border border-green-200 rounded-lg p-3 mb-4"></div>
                <div class="text-center">
                    <button id="restart" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-lg text-base font-bold">重新开始</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const allFactions = [
            { color: 'white', colorName: '白色·冰雪', name1: '伊塔星人', name1En: 'Itars', name2: '超星人', name2En: 'Nevlas' },
            { color: 'blue', colorName: '蓝色·陆地', name1: '亚特兰斯星人', name1En: 'Lantids', name2: '人类', name2En: 'Terrans' },
            { color: 'red', colorName: '红色·氧化', name1: '圣禽族', name1En: 'Hadsch Hallas', name2: '蜂人', name2En: 'Ivits' },
            { color: 'orange', colorName: '橙色·熔岩', name1: '炽炎族', name1En: 'Baltaks', name2: '晶矿星人', name2En: 'Geodens' },
            { color: 'yellow', colorName: '黄色·沙漠', name1: '格伦星人', name1En: 'Gleens', name2: '异空族', name2En: 'Xenos' },
            { color: 'brown', colorName: '棕色·沼泽', name1: '大使星人', name1En: 'Ambas', name2: '利爪族', name2En: 'Taklons' },
            { color: 'gray', colorName: '灰色·钛金', name1: '章鱼人', name1En: 'Firaks', name2: '疯狂机器', name2En: 'Bescods' },
            { color: 'cyan', colorName: '原行星', name1: '莫维兹星人', name1En: 'Mowyed', name2: '太空巨人', name2En: 'Space Giants', isExpansion: true },
            { color: 'pink', colorName: '小行星', name1: '暗黑星人', name1En: 'Darkanians', name2: '焊修智械', name2En: 'Tinkeroids', isExpansion: true }
        ];

        const colorClasses = {
            white: 'bg-gray-100 border-gray-300',
            blue: 'bg-blue-100 border-blue-300',
            red: 'bg-red-100 border-red-300',
            orange: 'bg-orange-100 border-orange-300',
            yellow: 'bg-yellow-100 border-yellow-300',
            brown: 'bg-amber-100 border-amber-300',
            gray: 'bg-gray-200 border-gray-400',
            cyan: 'bg-cyan-100 border-cyan-300',
            pink: 'bg-pink-100 border-pink-300'
        };

        let selectedFactions = [];
        let disabledFactions = [];
        let randomizedFactions = [];
        let playerCount = 3;
        let playerNames = [];
        let playerOrder = [];
        let bids = {};
        let auctionSteps = [];
        let currentStepIndex = 0;
        let autoPlayInterval = null;

        document.addEventListener('DOMContentLoaded', () => {
            renderPlayerNames();
            renderFactions();
            setupEventListeners();
        });

        function renderPlayerNames() {
            const container = document.getElementById('player-names-container');
            container.innerHTML = '';
            for (let i = 0; i < playerCount; i++) {
                const div = document.createElement('div');
                div.className = 'flex items-center gap-2';
                div.innerHTML = `
                    <span class="w-14 text-gray-700 text-sm">玩家${i+1}:</span>
                    <input type="text" class="player-name-input border rounded-lg px-3 py-1.5 flex-1 text-sm"
                           placeholder="请输入昵称" value="玩家${i+1}">
                `;
                container.appendChild(div);
            }
        }

        function shufflePlayerOrder() {
            playerNames = Array.from(document.querySelectorAll('.player-name-input'))
                .map(input => input.value.trim() || `玩家${Array.from(document.querySelectorAll('.player-name-input')).indexOf(input)+1}`);
            playerOrder = [...playerNames].sort(() => Math.random() - 0.5);
            updatePlayerOrderDisplay();
        }

        function updatePlayerOrderDisplay() {
            const display = document.getElementById('player-order-display');
            const list = document.getElementById('player-order-list');
            display.classList.remove('hidden');
            list.innerHTML = '';
            playerOrder.forEach((name, index) => {
                const div = document.createElement('div');
                div.className = 'flex items-center bg-gray-100 rounded-lg px-2.5 py-1.5 text-sm';
                div.innerHTML = `<span class="player-order-badge">${index+1}</span><span>${name}</span>`;
                list.appendChild(div);
            });
        }

        function renderFactions() {
            const container = document.getElementById('factions-container');
            const includeExpansion = document.getElementById('include-expansion').checked;
            container.innerHTML = '';
            allFactions.forEach(pair => {
                if (pair.isExpansion && !includeExpansion) return;
                const card = document.createElement('div');
                card.className = `faction-card ${colorClasses[pair.color]} border rounded-lg p-2.5`;
                card.dataset.color = pair.color;
                card.innerHTML = `
                    <div class="text-xs font-medium text-gray-600 mb-1.5">${pair.colorName}</div>
                    <div class="flex gap-2">
                        <button class="faction-btn flex-1 py-1.5 px-2 rounded text-left"
                                data-faction="${pair.name1En}" data-pair="${pair.name2En}">
                            <div class="font-bold text-sm">${pair.name1}</div>
                            <div class="text-xs text-gray-500">${pair.name1En}</div>
                        </button>
                        <button class="faction-btn flex-1 py-1.5 px-2 rounded text-left"
                                data-faction="${pair.name2En}" data-pair="${pair.name1En}">
                            <div class="font-bold text-sm">${pair.name2}</div>
                            <div class="text-xs text-gray-500">${pair.name2En}</div>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
            document.querySelectorAll('.faction-btn').forEach(btn => {
                btn.addEventListener('click', () => toggleFactionState(btn));
            });
            updateNextButton();
        }

        function toggleFactionState(btn) {
            const faction = btn.dataset.faction;
            const pair = btn.dataset.pair;
            const pairBtn = document.querySelector(`[data-faction="${pair}"]`);
            if (btn.classList.contains('paired-banned')) {
                btn.classList.remove('paired-banned');
                btn.classList.add('disabled');
                disabledFactions.push(faction);
                pairBtn.classList.remove('paired-banned');
                selectedFactions = selectedFactions.filter(f => f !== pair);
            } else if (btn.classList.contains('selected')) {
                btn.classList.remove('selected');
                btn.classList.add('disabled');
                selectedFactions = selectedFactions.filter(f => f !== faction);
                disabledFactions.push(faction);
                pairBtn.classList.remove('paired-banned');
            } else if (btn.classList.contains('disabled')) {
                btn.classList.remove('disabled');
                disabledFactions = disabledFactions.filter(f => f !== faction);
            } else {
                btn.classList.add('selected');
                selectedFactions.push(faction);
                pairBtn.classList.add('paired-banned');
                pairBtn.classList.remove('selected', 'disabled');
                selectedFactions = selectedFactions.filter(f => f !== pair);
                disabledFactions = disabledFactions.filter(f => f !== pair);
            }
            updateNextButton();
        }

        function updateNextButton() {
            const btn = document.getElementById('next-to-bid');
            btn.disabled = selectedFactions.length < playerCount;
        }

        function randomAllFactions() {
            const includeExpansion = document.getElementById('include-expansion').checked;
            const availablePairs = allFactions.filter(p => !p.isExpansion || includeExpansion);
            const usedColors = new Set();
            document.querySelectorAll('.faction-btn.selected, .faction-btn.disabled').forEach(btn => {
                const pair = allFactions.find(p => p.name1En === btn.dataset.faction || p.name2En === btn.dataset.faction);
                if (pair) usedColors.add(pair.color);
            });
            const unusedPairs = availablePairs.filter(p => !usedColors.has(p.color));
            const needMore = playerCount - selectedFactions.length;
            if (needMore <= 0 || unusedPairs.length === 0) return;
            const shuffledPairs = [...unusedPairs].sort(() => Math.random() - 0.5);
            const selectedPairs = shuffledPairs.slice(0, needMore);
            selectedPairs.forEach(pair => {
                const chooseFirst = Math.random() > 0.5;
                const faction = chooseFirst ? pair.name1En : pair.name2En;
                const btn = document.querySelector(`[data-faction="${faction}"]`);
                toggleFactionState(btn);
            });
        }

        function showRandomizedFactions() {
            const list = document.getElementById('randomized-factions-list');
            list.innerHTML = '';
            randomizedFactions.forEach((faction, index) => {
                let factionName = faction;
                allFactions.forEach(pair => {
                    if (pair.name1En === faction) factionName = pair.name1;
                    if (pair.name2En === faction) factionName = pair.name2;
                });
                const div = document.createElement('div');
                div.className = 'flex items-center bg-white border border-green-300 rounded px-2 py-1 text-sm';
                div.innerHTML = `<span class="faction-order-badge">${index+1}</span><span>${factionName}</span>`;
                list.appendChild(div);
            });
        }

        function showAuctionFactions() {
            const list = document.getElementById('auction-factions-list');
            list.innerHTML = '';
            randomizedFactions.forEach((faction, index) => {
                let factionName = faction;
                allFactions.forEach(pair => {
                    if (pair.name1En === faction) factionName = pair.name1;
                    if (pair.name2En === faction) factionName = pair.name2;
                });
                const div = document.createElement('div');
                div.className = 'flex items-center bg-white border border-blue-300 rounded px-2 py-1 text-sm';
                div.innerHTML = `<span class="faction-order-badge">${index+1}</span><span>${factionName}</span>`;
                list.appendChild(div);
            });
        }

        // 计算单个玩家归一化分数
        function calcPlayerNorm(rawObj) {
            const vals = Object.values(rawObj);
            const minVal = Math.min(...vals);
            const offset = minVal < 0 ? -minVal : 0;
            let res = {};
            Object.entries(rawObj).forEach(([k,v])=>{
                res[k] = v + offset;
            });
            return {norm: res, offset};
        }

        // 渲染出价表格：直接显示归一化后分数
        function renderBidTable() {
            const container = document.getElementById('bid-table-container');
            let tableHTML = `
                <table class="w-full border-collapse text-sm">
                    <thead>
                        <tr class="bg-gray-100">
                            <th class="border p-2 text-left">玩家</th>
                            ${randomizedFactions.map(f => {
                                let factionName = f;
                                allFactions.forEach(pair => {
                                    if (pair.name1En === f) factionName = pair.name1;
                                    if (pair.name2En === f) factionName = pair.name2;
                                });
                                return `<th class="border p-2 text-center">${factionName}</th>`;
                            }).join('')}
                        </tr>
                    </thead>
                    <tbody>
            `;
            playerOrder.forEach(player => {
                tableHTML += `
                    <tr>
                        <td class="border p-2 font-medium">${player}</td>
                        ${randomizedFactions.map(f => `
                            <td class="border p-2 text-center">
                                <input type="number" min="-100" max="100" value="0"
                                       class="bid-input w-14 text-center border rounded px-1 py-1 text-sm"
                                       data-player="${player}" data-faction="${f}">
                            </td>
                        `).join('')}
                    </tr>
                `;
            });
            tableHTML += `</tbody></table>`;
            container.innerHTML = tableHTML;

            bids = {};
            playerOrder.forEach(p => {
                bids[p] = {};
                randomizedFactions.forEach(f => {
                    bids[p][f] = 0;
                });
            });
            document.querySelectorAll('.bid-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    bids[e.target.dataset.player][e.target.dataset.faction] = parseInt(e.target.value) || 0;
                });
            });
        }

        function precomputeAuctionSteps() {
            const players = [...playerOrder];
            const factions = [...randomizedFactions];
            const currentBids = {};
            const currentWinners = {};
            const steps = [];

            factions.forEach(f => {
                currentBids[f] = -1;
                currentWinners[f] = null;
            });

            // 全局归一化所有玩家
            const normBids = {};
            const adjustLogs = [];
            players.forEach(p=>{
                let {norm, offset} = calcPlayerNorm(bids[p]);
                normBids[p] = norm;
                if(offset > 0){
                    adjustLogs.push(`${p} 分数上浮 ${offset}，最低出价置0`);
                }
            });

            steps.push({
                type: 'init',
                currentBids: {...currentBids},
                currentWinners: {...currentWinners},
                normBids: JSON.parse(JSON.stringify(normBids)),
                log: { type: 'info', message: '拍卖开始，已自动将所有玩家负分出价归一化' }
            });

            adjustLogs.forEach(msg=>{
                steps.push({
                    type: 'info',
                    currentBids: {...currentBids},
                    currentWinners: {...currentWinners},
                    normBids: JSON.parse(JSON.stringify(normBids)),
                    log: { type: 'adjust', message: `⚙️ ${msg}` }
                });
            });

            let round = 0;
            while (true) {
                round++;
                let anyBidMade = false;
                for (const player of players) {
                    const hasWin = Object.values(currentWinners).includes(player);
                    if(hasWin) continue;

                    const gaps = {};
                    factions.forEach(f=>{
                        if(currentWinners[f] === player){
                            gaps[f] = -1;
                        }else{
                            gaps[f] = normBids[player][f] - currentBids[f];
                        }
                    });

                    let bestFaction = null;
                    let maxGap = -Infinity;
                    Object.entries(gaps).forEach(([f,gap])=>{
                        if(gap > maxGap){
                            maxGap = gap;
                            bestFaction = f;
                        }else if(gap === maxGap){
                            if(currentBids[f]===-1 && currentBids[bestFaction]!==-1){
                                bestFaction = f;
                            }
                        }
                    });

                    if(!bestFaction || maxGap <= 0) continue;

                    const newBid = currentBids[bestFaction]===-1 ? 0 : currentBids[bestFaction]+1;
                    if(newBid > normBids[player][bestFaction]) continue;

                    const prevW = currentWinners[bestFaction];
                    currentBids[bestFaction] = newBid;
                    currentWinners[bestFaction] = player;
                    anyBidMade = true;

                    let fName = bestFaction;
                    allFactions.forEach(pair=>{
                        if(pair.name1En === bestFaction) fName = pair.name1;
                        if(pair.name2En === bestFaction) fName = pair.name2;
                    });
                    let logMsg = prevW
                        ? `${player} 加价至 ${newBid}VP 超过 ${prevW}`
                        : `${player} 出价 ${newBid}VP 竞拍 ${fName}`;

                    steps.push({
                        type:'bid',
                        currentPlayer:player,
                        currentFaction:bestFaction,
                        currentBids:{...currentBids},
                        currentWinners:{...currentWinners},
                        normBids:JSON.parse(JSON.stringify(normBids)),
                        log:{type:'bid',message:logMsg}
                    });
                }

                const allDone = Object.values(currentWinners).every(w=>w!==null);
                const cnt = {};
                Object.values(currentWinners).forEach(w=>cnt[w]=(cnt[w]||0)+1);
                const oneEach = Object.values(cnt).every(c=>c===1);
                const allIn = Object.keys(cnt).length === players.length;

                if(allDone && oneEach && allIn) break;
                if(!anyBidMade) break;
                if(round>1000) break;
            }

            Object.entries(currentWinners).forEach(([fac,p])=>{
                if(!p) return;
                let fName = fac;
                allFactions.forEach(pair=>{
                    if(pair.name1En===fac) fName=pair.name1;
                    if(pair.name2En===fac) fName=pair.name2;
                });
                steps.push({
                    type:'win',
                    currentBids:{...currentBids},
                    currentWinners:{...currentWinners},
                    normBids:JSON.parse(JSON.stringify(normBids)),
                    log:{type:'win',message:`🎉 ${p} 获得 ${fName}`}
                });
            });

            const maxPaid = Math.max(...Object.values(currentBids).filter(b=>b>=0));
            steps.push({
                type:'complete',
                currentBids:{...currentBids},
                currentWinners:{...currentWinners},
                normBids:JSON.parse(JSON.stringify(normBids)),
                log:{type:'info',message:`💰 最高出价${maxPaid}VP，统一结算补偿`},
                maxPaid
            });
            return steps;
        }

        // 渲染竞拍表格：显示归一化后分数
        function renderAuctionStatusTable(step) {
            const table = document.getElementById('auction-status-table');
            let tableHTML = `
                <thead>
                    <tr class="bg-gray-100">
                        <th class="border p-2 text-left w-24">种族</th>
                        <th class="border p-2 text-center w-16">当前出价</th>
                        ${playerOrder.map(player => `
                            <th class="border p-2 text-center">${player}</th>
                        `).join('')}
                    </tr>
                </thead>
                <tbody>
            `;
            randomizedFactions.forEach(faction => {
                let factionName = faction;
                allFactions.forEach(pair => {
                    if (pair.name1En === faction) factionName = pair.name1;
                    if (pair.name2En === faction) factionName = pair.name2;
                });
                const currBid = step.currentBids[faction];
                const currWin = step.currentWinners[faction];
                const isHigh = step.currentFaction === faction;
                let rowClass = '';
                if(step.type==='complete'||step.type==='win') rowClass='winner-cell';
                else if(isHigh) rowClass='bg-yellow-50';

                const dispBid = currBid === -1 ? '-' : currBid;
                tableHTML += `
                    <tr class="${rowClass}">
                        <td class="border p-2 font-medium">${factionName}</td>
                        <td class="border p-2 text-center current-bid">${dispBid}</td>
                        ${playerOrder.map(player=>{
                            const normScore = step.normBids[player][faction];
                            const gap = currBid===-1 ? normScore : normScore - currBid;
                            const isLeader = currWin === player;
                            const cellClass = isLeader ? 'leader-cell' : '';
                            return `
                                <td class="border p-1.5 text-center ${cellClass}">
                                    <div class="original-bid">${normScore}</div>
                                    <div class="gap-value">余${gap}</div>
                                </td>
                            `;
                        }).join('')}
                    </tr>
                `;
            });
            tableHTML += `</tbody>`;
            table.innerHTML = tableHTML;
        }

        function showCurrentStep() {
            const step = auctionSteps[currentStepIndex];
            renderAuctionStatusTable(step);
            const logContainer = document.getElementById('auction-log');
            let className = 'log-entry';
            if(step.log.type==='bid') className+=' log-bid';
            if(step.log.type==='win') className+=' log-win';
            if(step.log.type==='adjust') className+=' log-adjust';
            const logEntry = document.createElement('div');
            logEntry.className = className;
            logEntry.textContent = step.log.message;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;

            document.getElementById('prev-step').disabled = currentStepIndex === 0;
            document.getElementById('next-step').disabled = currentStepIndex === auctionSteps.length - 1;

            if(step.type === 'complete'){
                showFinalResults(step);
                stopAutoPlay();
                document.getElementById('auto-play').disabled = true;
                document.getElementById('next-step').disabled = true;
                document.getElementById('skip-animation').disabled = true;
            }
        }

        function showFinalResults(step) {
            const resultsContainer = document.getElementById('final-results');
            const summaryContainer = document.getElementById('results-summary');
            resultsContainer.classList.remove('hidden');
            let summaryHTML = '<h3 class="text-base font-bold mb-2">最终分配结果</h3><ul class="space-y-1 text-sm">';
            playerOrder.forEach(player => {
                let faction = null;
                let paid = 0;
                randomizedFactions.forEach(f => {
                    if (step.currentWinners[f] === player) {
                        faction = f;
                        paid = step.currentBids[f];
                    }
                });
                let factionName = faction;
                allFactions.forEach(pair => {
                    if (pair.name1En === faction) factionName = pair.name1;
                    if (pair.name2En === faction) factionName = pair.name2;
                });
                const startingVP = 10 + (step.maxPaid - paid);
                summaryHTML += `
                    <li><strong>${player}</strong> 获得 <strong>${factionName}</strong>，花费 ${paid} VP，开局拥有 <strong>${startingVP} VP</strong></li>
                `;
            });
            summaryHTML += '</ul>';
            summaryContainer.innerHTML = summaryHTML;
        }

        function startAutoPlay() {
            if(autoPlayInterval) return;
            document.getElementById('auto-play').textContent = '⏸ 暂停';
            autoPlayInterval = setInterval(() => {
                if(currentStepIndex < auctionSteps.length - 1){
                    currentStepIndex++;
                    showCurrentStep();
                }else{
                    stopAutoPlay();
                }
            },800);
        }

        function stopAutoPlay() {
            if(autoPlayInterval){
                clearInterval(autoPlayInterval);
                autoPlayInterval = null;
                document.getElementById('auto-play').textContent = '▶ 自动播放';
            }
        }

        function skipAnimation() {
            stopAutoPlay();
            document.getElementById('auction-log').innerHTML = '';
            while(currentStepIndex < auctionSteps.length - 1){
                currentStepIndex++;
                const step = auctionSteps[currentStepIndex];
                const logContainer = document.getElementById('auction-log');
                let className = 'log-entry';
                if(step.log.type==='bid') className+=' log-bid';
                if(step.log.type==='win') className+=' log-win';
                if(step.log.type==='adjust') className+=' log-adjust';
                const logEntry = document.createElement('div');
                logEntry.className = className;
                logEntry.textContent = step.log.message;
                logContainer.appendChild(logEntry);
            }
            const finalStep = auctionSteps[auctionSteps.length - 1];
            renderAuctionStatusTable(finalStep);
            showFinalResults(finalStep);
            document.getElementById('prev-step').disabled = false;
            document.getElementById('next-step').disabled = true;
            document.getElementById('auto-play').disabled = true;
            document.getElementById('skip-animation').disabled = true;
        }

        function switchStep(fromStep, toStep) {
            document.getElementById(`step${fromStep}`).classList.add('hidden');
            document.getElementById(`step${toStep}`).classList.remove('hidden');
            document.getElementById(`step${fromStep}-indicator`).classList.remove('step-active');
            document.getElementById(`step${fromStep}-indicator`).classList.add('bg-gray-200', 'text-gray-600');
            document.getElementById(`step${toStep}-indicator`).classList.add('step-active');
            document.getElementById(`step${toStep}-indicator`).classList.remove('bg-gray-200', 'text-gray-600');
            if(toStep === 3) showAuctionFactions();
        }

        function setupEventListeners() {
            document.getElementById('player-count').addEventListener('change', (e) => {
                playerCount = parseInt(e.target.value);
                renderPlayerNames();
            });
            document.getElementById('next-to-factions').addEventListener('click', () => {
                shufflePlayerOrder();
                switchStep(0, 1);
            });
            document.getElementById('back-to-names').addEventListener('click', () => {
                document.getElementById('player-order-display').classList.add('hidden');
                switchStep(1, 0);
            });
            document.getElementById('include-expansion').addEventListener('change', () => {
                selectedFactions = [];
                disabledFactions = [];
                renderFactions();
            });
            document.getElementById('random-all').addEventListener('click', randomAllFactions);
            document.getElementById('reset-factions').addEventListener('click', () => {
                selectedFactions = [];
                disabledFactions = [];
                renderFactions();
            });
            document.getElementById('next-to-bid').addEventListener('click', () => {
                randomizedFactions = [...selectedFactions].sort(() => Math.random() - 0.5);
                switchStep(1, 2);
                showRandomizedFactions();
                renderBidTable();
            });
            document.getElementById('back-to-factions').addEventListener('click', () => {
                switchStep(2, 1);
            });
            document.getElementById('start-auction').addEventListener('click', () => {
                auctionSteps = precomputeAuctionSteps();
                currentStepIndex = 0;
                document.getElementById('auction-log').innerHTML = '';
                document.getElementById('final-results').classList.add('hidden');
                document.getElementById('auto-play').disabled = false;
                document.getElementById('next-step').disabled = false;
                document.getElementById('skip-animation').disabled = false;
                document.getElementById('auto-play').textContent = '▶ 自动播放';
                switchStep(2, 3);
                showCurrentStep();
            });
            document.getElementById('prev-step').addEventListener('click', () => {
                if(currentStepIndex > 0){
                    currentStepIndex--;
                    document.getElementById('auction-log').innerHTML = '';
                    for(let i=0;i<=currentStepIndex;i++){
                        const step = auctionSteps[i];
                        const logContainer = document.getElementById('auction-log');
                        let className = 'log-entry';
                        if(step.log.type==='bid') className+=' log-bid';
                        if(step.log.type==='win') className+=' log-win';
                        if(step.log.type==='adjust') className+=' log-adjust';
                        const logEntry = document.createElement('div');
                        logEntry.className = className;
                        logEntry.textContent = step.log.message;
                        logContainer.appendChild(logEntry);
                    }
                    renderAuctionStatusTable(auctionSteps[currentStepIndex]);
                    document.getElementById('next-step').disabled = false;
                    document.getElementById('auto-play').disabled = false;
                    document.getElementById('skip-animation').disabled = false;
                }
            });
            document.getElementById('next-step').addEventListener('click', () => {
                if(currentStepIndex < auctionSteps.length - 1){
                    currentStepIndex++;
                    showCurrentStep();
                }
            });
            document.getElementById('auto-play').addEventListener('click', () => {
                autoPlayInterval ? stopAutoPlay() : startAutoPlay();
            });
            document.getElementById('skip-animation').addEventListener('click', skipAnimation);
            document.getElementById('restart').addEventListener('click', () => {
                stopAutoPlay();
                document.getElementById('player-order-display').classList.add('hidden');
                switchStep(3, 0);
                selectedFactions = [];
                disabledFactions = [];
                randomizedFactions = [];
                auctionSteps = [];
                currentStepIndex = 0;
                renderFactions();
            });
        }
    </script>
</body>
</html>
